<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>首页 · 提示词画布</title>
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/canvas.css" />
  <link rel="stylesheet" href="shared/home.css" />
  <link rel="stylesheet" href="shared/image.css" />
  <script src="shared/app.js"></script>
</head>
<body class="hm">
  <header class="appbar" data-od-id="home-appbar">
    <a class="brand" href="home.html"><span class="brand-mark" data-icon="logo"></span>提示词画布</a>
    <span class="spacer"></span>
    <button class="cf-pill" data-od-id="comfy-status"></button>
    <a class="path-pill hide-sm" id="workdirPill" href="settings.html#workdir" title="工作文件夹，点一下去设置里换" data-od-id="workdir-pill"><span data-icon="folder" data-icon-class="icon-sm"></span><span>D:\同步盘\提示词画布</span></a>
    <button class="btn btn-ghost btn-icon" data-theme-toggle></button>
    <a class="btn btn-ghost" href="settings.html" data-icon="gear" data-od-id="link-settings"><span class="hide-sm">设置</span></a>
    <span class="vr hide-sm"></span>
    <button class="btn btn-primary" id="btnNew" data-icon="plus" data-od-id="btn-new-canvas"><span class="hide-sm">新建画布</span></button>
  </header>

  <main class="hm-page" data-od-id="home-page">
    <!-- 这台机器上要处理的事：只在有问题时出现 -->
    <div id="issues"></div>
    <!-- 整页状态：正在读取的提示、工作文件夹打不开、一个画布都没有 -->
    <div id="pageState"></div>

    <div class="hm-layout" id="layout">
      <section class="hm-sec hm-recent-sec" aria-labelledby="recentTitle" data-od-id="recent-nodes">
        <header class="hm-sec-head">
          <h2 id="recentTitle">最近动过的节点</h2>
          <span class="meta" id="recentMeta">跨全部画布，点一下直接进节点的对话</span>
        </header>
        <div class="hm-recent" id="recent"></div>
      </section>

      <aside class="hm-sec hm-stars-sec" aria-labelledby="starsTitle" data-od-id="starred-prompts">
        <header class="hm-sec-head">
          <h2 id="starsTitle">打过星的提示词</h2>
          <span class="meta" id="starsMeta"></span>
        </header>
        <div class="hm-stars" id="stars"></div>
      </aside>

      <section class="hm-sec hm-canvas-sec" aria-labelledby="canvasTitle" data-od-id="all-canvases">
        <header class="hm-sec-head">
          <h2 id="canvasTitle">全部画布</h2>
          <span class="meta" id="canvasMeta"></span>
          <span class="grow"></span>
          <label class="hm-search" data-od-id="canvas-search"><span data-icon="search" data-icon-class="icon-sm"></span>
            <input class="input" id="search" type="search" placeholder="按名字找画布" autocomplete="off" aria-label="按名字找画布" /></label>
        </header>
        <div class="hm-canvases" id="canvases"></div>
      </section>
    </div>
  </main>

  <!-- 只在原型里有：切到各种状态看样子 -->
  <label class="hm-proto" title="只在原型里有，正式程序里没有" data-od-id="home-prototype-states">
    <span>原型</span>
    <select class="select select-sm" id="proto" aria-label="原型：切换首页状态">
      <option value="normal">正常：有生成中、有失败、有没填密钥</option>
      <option value="loading">正在读取工作文件夹</option>
      <option value="error">工作文件夹打不开</option>
      <option value="noCanvas">一个画布都没有</option>
      <option value="noNodes">有画布，还没有节点发过消息</option>
      <option value="noStars">还没打过星</option>
      <option value="keysOk">密钥都填了（不出现要处理的事）</option>
      <option value="many">画布有几十个</option>
      <optgroup label="生图">
        <option value="autodlRunning">AutoDL 开着（在扣钱，顶上一直显示）</option>
        <option value="autodlForgot">出图用局域网那台，AutoDL 也还开着</option>
      </optgroup>
      <option value="searchMiss">按名字找，没找到</option>
      <option value="deleted">刚删了一个画布（可以撤销）</option>
    </select>
  </label>

  <dialog class="dialog" id="dlgNew" aria-label="新建画布" data-od-id="dialog-new-canvas">
    <form method="dialog">
      <div class="dialog-head"><h2>新建画布</h2></div>
      <div class="dialog-body">
        <div class="field">
          <label for="newTitle">画布名字</label>
          <input class="input" id="newTitle" maxlength="30" placeholder="比如：春节回家短片" autocomplete="off" />
          <p class="hint row-between"><span id="newHint">一个创作项目一张画布，建好后在里面建节点。</span><span class="mono" id="newCount">0/30</span></p>
        </div>
      </div>
      <div class="dialog-foot">
        <button class="btn btn-secondary" value="cancel" formnovalidate>取消</button>
        <button class="btn btn-primary" value="ok" id="newOk">新建</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog dialog-sheet" id="dlgUpload" style="width:min(780px, calc(100vw - 32px))" aria-label="上传清单" data-od-id="dialog-upload-list">
    <div class="dialog-head">
      <div class="stack" style="gap:2px; min-width:0">
        <h2>上传清单</h2>
        <span class="meta" id="upSub"></span>
      </div>
      <div class="row">
        <button class="btn btn-secondary btn-sm" id="upCopyPrompt" data-icon="copy">复制提示词</button>
        <button class="btn btn-ghost btn-icon" data-close data-icon="x" aria-label="关闭"></button>
      </div>
    </div>
    <div class="dialog-body" id="upBody"></div>
    <div class="dialog-foot">
      <span class="meta grow" id="upFootNote"></span>
      <button class="btn btn-secondary" id="upCopyAll" data-icon="copy">复制全部路径</button>
      <button class="btn btn-primary" data-close>好了</button>
    </div>
  </dialog>

  <script src="shared/canvas-data.js"></script>
  <script src="shared/image-data.js"></script>
  <script src="shared/image-core.js"></script>
  <script src="shared/home.js"></script>
</body>
</html>
